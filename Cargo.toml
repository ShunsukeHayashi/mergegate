[workspace]
resolver = "2"
members = [
    "crates/miyabi-cli",
    "crates/miyabi-tui",
    "crates/miyabi-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Miyabi Team"]
license = "MIT"
repository = "https://github.com/ShunsukeHayashi/miyabi-cli-standalone"
homepage = "https://github.com/ShunsukeHayashi/miyabi-cli-standalone"
description = "Miyabi - Autonomous AI Development Framework"
keywords = ["ai", "cli", "tui", "autonomous", "development"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# Async Runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "process", "signal"] }
futures = "0.3"
async-trait = "0.1"

# TUI Framework
ratatui = { version = "0.29.0", features = [
    "scrolling-regions",
    "unstable-backend-writer",
    "unstable-rendered-line-info",
    "unstable-widget-ref",
] }
crossterm = { version = "0.29.0", features = ["bracketed-paste", "event-stream"] }

# Text Processing
textwrap = "0.16"
unicode-width = "0.2"
pulldown-cmark = "0.12"
syntect = "5"

# CLI
clap = { version = "4", features = ["derive"] }

# Error Handling
anyhow = "1"
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP Client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
glob = "0.3"
regex = "1"
