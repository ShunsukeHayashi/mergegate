name: Auto-merge MergeGate PRs

# Copilot Coding Agent の PR、または `mergegate-auto-merge` ラベル付き PR が
# 1) 実際の CI workflow の必須 check を全て通過し、
# 2) AI レビュー (ai-review.yml) で APPROVE された
# 場合に自動マージする。

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]
  check_run:
    types: [completed]

jobs:
  auto-merge:
    name: Auto-merge if CI + AI Review passed
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'check_run' ||
      github.event.pull_request.user.login == 'Copilot' ||
      contains(github.event.pull_request.labels.*.name, 'mergegate-auto-merge')
    permissions:
      pull-requests: write
      contents: write
      checks: read
    steps:
      - name: Check CI status and AI review approval
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;

            // イベント種別に応じて PR 番号を取得
            if (context.eventName === 'check_run') {
              const runName = context.payload.check_run.name;
              if (runName === 'Auto-merge if CI + AI Review passed') {
                console.log('Skipping self-triggered check_run');
                return;
              }
              const prs = context.payload.check_run.pull_requests;
              if (!prs || prs.length === 0) {
                console.log('check_run: no associated PRs, skipping');
                return;
              }
              prNumber = prs[0].number;
              console.log(`check_run "${runName}" completed: checking PR #${prNumber}`);
            } else {
              prNumber = context.payload.pull_request?.number
                || context.payload.review?.pull_request_url?.match(/\/pulls\/(\d+)$/)?.[1];
            }

            if (!prNumber) {
              console.log('No PR number found, skipping');
              return;
            }

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              pull_number: Number(prNumber),
            });

            // すでに closed/merged の PR はスキップ
            if (pr.data.state !== 'open') {
              console.log(`PR #${prNumber} is ${pr.data.state}, skipping`);
              return;
            }

            // Draft PR はスキップ
            if (pr.data.draft) {
              console.log(`PR #${prNumber} is still Draft, skipping`);
              return;
            }

            const labels = (pr.data.labels || []).map(label => label.name);
            const canAutoMerge = pr.data.user.login === 'Copilot' || labels.includes('mergegate-auto-merge');
            if (!canAutoMerge) {
              console.log(`PR #${prNumber}: not Copilot and missing mergegate-auto-merge label, skipping`);
              return;
            }

            // ── CI チェックの状態を確認 ──────────────────────────────
            const checks = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              ref:   pr.data.head.sha,
              per_page: 100,
            });

            const requiredChecks = [
              { prefix: 'Check', min: 1 },
              { prefix: 'Test Suite', min: 2 },
              { prefix: 'Rustfmt', min: 1 },
              { prefix: 'Clippy', min: 1 },
              { prefix: 'Build Release', min: 3 },
              { prefix: 'Security Audit', min: 1 },
            ];

            // 同名の check_run が複数ある場合（re-run）は最新のものだけを使う。
            const latestByName = new Map();
            for (const c of checks.data.check_runs) {
              if (c.name === 'Auto-merge if CI + AI Review passed') {
                continue;
              }

              const prev = latestByName.get(c.name);
              if (!prev || new Date(c.started_at) > new Date(prev.started_at)) {
                latestByName.set(c.name, c);
              }
            }
            const latestChecks = Array.from(latestByName.values());
            const checkGroups = requiredChecks.map(required => {
              const runs = latestChecks.filter(c => c.name.startsWith(required.prefix));
              return { ...required, runs };
            });

            const missing = checkGroups
              .filter(group => group.runs.length < group.min)
              .map(group => `${group.prefix}: expected ${group.min}, found ${group.runs.length}`);
            const failing = checkGroups.flatMap(group =>
              group.runs
                .filter(c => c.status !== 'completed' || c.conclusion !== 'success')
                .map(c => `${c.name}:${c.conclusion ?? c.status}`)
            );

            const ciChecks = checkGroups.flatMap(group => group.runs);
            const ciPassed = missing.length === 0 && failing.length === 0;
            const ciStatus = ciChecks.map(c => `${c.name}:${c.conclusion ?? c.status}`).join(', ');
            console.log(`PR #${prNumber} CI (latest runs): ${ciStatus || 'no checks found'}`);
            if (missing.length > 0) {
              console.log(`PR #${prNumber}: missing required checks: ${missing.join('; ')}`);
            }
            if (failing.length > 0) {
              console.log(`PR #${prNumber}: failing/pending checks: ${failing.join('; ')}`);
            }

            if (!ciPassed) {
              console.log(`PR #${prNumber}: CI not fully passed yet, skipping`);
              return;
            }

            // ── AI レビューの APPROVE を確認 ─────────────────────────
            const reviews = await github.rest.pulls.listReviews({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              pull_number: Number(prNumber),
              per_page: 100,
            });

            const latestByReviewer = {};
            for (const r of reviews.data) {
              if (r.state !== 'COMMENTED') {
                latestByReviewer[r.user.login] = r.state;
              }
            }

            const hasApproval = Object.values(latestByReviewer).includes('APPROVED');
            const hasChangesRequested = Object.values(latestByReviewer).includes('CHANGES_REQUESTED');

            console.log(`PR #${prNumber} reviews: ${JSON.stringify(latestByReviewer)}`);

            if (hasChangesRequested) {
              console.log(`PR #${prNumber}: AI review requested changes, skipping merge`);
              return;
            }

            if (!hasApproval) {
              console.log(`PR #${prNumber}: No APPROVE review yet, waiting for AI review`);
              return;
            }

            console.log(`PR #${prNumber}: CI passed + AI review approved. Proceeding to merge.`);

            // ── マージ実行（squash） ──────────────────────────────────
            try {
              await github.rest.pulls.merge({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                pull_number:  Number(prNumber),
                merge_method: 'squash',
              });
              console.log(`✅ Merged PR #${prNumber}`);
            } catch (err) {
              if (err.status === 405) {
                // Branch protection: GitHub native auto-merge を有効化
                try {
                  await github.graphql(`
                    mutation EnableAutoMerge($prId: ID!) {
                      enablePullRequestAutoMerge(input: {
                        pullRequestId: $prId
                        mergeMethod: SQUASH
                      }) {
                        pullRequest { number state }
                      }
                    }
                  `, { prId: pr.data.node_id });
                  console.log(`Enabled GitHub auto-merge for PR #${prNumber}`);
                } catch (graphqlErr) {
                  console.log(`Auto-merge enable failed: ${graphqlErr.message}`);
                }
              } else if (err.status === 404 || err.status === 422) {
                console.log(`PR #${prNumber} not mergeable (${err.status}): ${err.message}`);
              } else {
                throw err;
              }
            }
